server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rsmad_db?useSSL=false&serverTimezone=UTC
    username: user
    password: user
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: clave-secreta-supersegura
  expiration: 3600000  # 1 hora en milisegundos

logging:
  level:
    org.springframework: INFO
    com.rsmad: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

